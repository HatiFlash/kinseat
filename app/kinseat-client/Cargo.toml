[package]
name = "kinseat-client"
version = "0.3.21"
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-only"

[dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "=0.32.3"
wgpu = { version = "=25.0.2", default-features = false, features = ["dx12", "vulkan", "gles", "metal", "wgsl"] }
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdns-sd = "0.11"
flume = "0.11"
rand = "0.8"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

