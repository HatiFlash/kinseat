[package]
name = "kinseat-preflight"
version = "0.3.20"
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Registry", "Win32_System_Services", "Win32_System_Threading"] }
