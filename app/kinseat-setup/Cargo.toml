[package]
name = "kinseat-setup"
version = "0.3.17"
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "=0.32.3"
wgpu = { version = "=25.0.2", default-features = false, features = ["dx12", "vulkan", "gles", "metal", "wgsl"] }
kinseat-preflight = { path = "../kinseat-preflight" }
serde_json = "=1.0.145"
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
image = { version = "=0.25.9", default-features = false, features = ["png"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
sha2 = "=0.10.9"
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Console"] }
